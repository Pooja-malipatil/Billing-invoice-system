<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log in - BillDesk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>🧾 BillDesk</h1>
      <p class="subtitle">Log in to your account</p>
      {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
      <form method="POST" action="/login">
        <label>Username<input type="text" name="username" required autofocus></label>
        <label>Password<input type="password" name="password" required></label>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 8px;">Log In</button>
      </form>
      <p class="auth-switch">No account? <a href="/register">Register here</a></p>
    </div>
  </main>
</body>
</html>
