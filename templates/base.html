<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Billing & Invoice Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🧾 BillDesk</div>
    <div class="nav-links">
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
      <a href="/customers" class="{{ 'active' if request.path == '/customers' else '' }}">Customers</a>
      <a href="/invoices" class="{{ 'active' if request.path.startswith('/invoices') else '' }}">Invoices</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast"></div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
