# Local development convenience: `docker compose up` builds the image and
# runs it with a persistent volume for the SQLite file, so data survives
# container restarts (unlike a plain `docker run` with no volume).
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-only-secret-change-me
      - DB_PATH=/data/billing.db
      - PORT=5000
    volumes:
      - billdesk-data:/data

volumes:
  billdesk-data:
